version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
  exclusions:
    rules:
      # G115: protocol lengths come from slices the gateway built itself and
      # are bounded by the parser limits (ADR-0033).
      - path: internal/ppcs/.*\.go
        linters:
          - gosec
        text: G115
      # Test fixtures read from temporary roots and write small files.
      - path: .*_test\.go
        linters:
          - gosec
        text: "G304|G306"
