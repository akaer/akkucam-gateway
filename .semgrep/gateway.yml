# Project invariants that the generic rulesets do not cover.
# Referenced from ADR-0033 and specs/security.md.
rules:
  - id: gateway-no-outbound-http-client
    languages: [go]
    severity: ERROR
    message: >-
      The gateway speaks only LAN UDP and local HTTP (ADR-0003). An outbound
      HTTP client needs a new decision.
    patterns:
      - pattern-either:
          - pattern: http.Get(...)
          - pattern: http.Post(...)
          - pattern: http.PostForm(...)
          - pattern: http.Head(...)
          - pattern: http.NewRequest(...)
          - pattern: http.NewRequestWithContext(...)
          - pattern: http.DefaultClient.Do(...)

  - id: gateway-no-outbound-tcp
    languages: [go]
    severity: ERROR
    message: >-
      Discovery and PPCS run over UDP in the LAN only (ADR-0003). An outbound
      TCP dial needs a new decision.
    patterns:
      - pattern-either:
          - pattern: net.Dial(...)
          - pattern: net.DialTimeout(...)
          - pattern: net.DialTCP(...)
          - pattern: net.DialIP(...)

  - id: gateway-secret-key-in-browser-storage
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Security codes stay in browser RAM (ADR-0007, ADR-0012). Do not write them
      to localStorage or sessionStorage.
    patterns:
      - pattern-regex: (local|session)Storage\.setItem\(\s*['"][^'"]*(code|pin|secret|token|password)

  - id: gateway-secret-value-in-browser-storage
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Security codes stay in browser RAM (ADR-0007, ADR-0012). Do not write them
      to localStorage or sessionStorage.
    patterns:
      - pattern-either:
          - pattern: localStorage.setItem($K, $V)
          - pattern: sessionStorage.setItem($K, $V)
          - pattern: localStorage[$K] = $V
          - pattern: sessionStorage[$K] = $V
      - metavariable-regex:
          metavariable: $V
          regex: (?i).*(code|pin|secret|token|password).*
